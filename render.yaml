services:
  - type: web
    name: wissen-crm
    # Ilovada backend server (server.ts) bor: AI-baholash uchun /api/* yo'llari.
    # Shu sabab "static" emas, Node web-service sifatida deploy qilinadi.
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      # Gemini AI baholash funksiyasi uchun (server.ts ishlatadi)
      - key: GEMINI_API_KEY
        sync: false
      # Firebase (frontend build vaqtida kerak)
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
      # Nomlangan Firestore bazasi (masalan "wissen"). Client VA server ham
      # shu bazaga ulanadi. Bo'sh bo'lsa "(default)" ishlatiladi.
      - key: VITE_FIREBASE_DATABASE_ID
        sync: false
      # Push bildirishnoma (FCM Web Push) uchun VAPID kaliti — build vaqtida
      # frontendga kerak. Usiz talabalarda token yaratilmaydi (hech kimga
      # xabarnoma bormaydi). Firebase Console -> Project Settings -> Cloud
      # Messaging -> Web Push certificates -> "Key pair" dan olinadi.
      - key: VITE_FIREBASE_VAPID_KEY
        sync: false
      # Server xabarnoma yuborishi uchun Firebase Admin service account JSON.
      # Firebase Console -> Project Settings -> Service accounts ->
      # "Generate new private key" -> yuklab olingan JSON ning butun matni.
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false